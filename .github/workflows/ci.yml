name: CI
on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: ["*"] # Run on PRs to any branch

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # For coverage comments
env:
  SHELL: /bin/bash
  # Registre unique pour les deux applications de la machine : ghcr.io.
  # Kamal (config/deploy.yml) y publie et le serveur y retire l'image a chaque
  # deploiement ; le quota de telechargement d'un compte Docker Hub gratuit se
  # compte donc en deploiements. Les deux doivent viser le meme depot, sinon
  # l'image etiquetee par la CI n'est pas celle que le serveur va chercher.
  DOCKER_IMAGE: "ghcr.io/thibaultsan/portfolio"

jobs:
  tools:
    name: TOOLS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

  quality:
    name: QUALITY
    needs: [tools]
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-
            ${{ env.MIX_ENV }}-mise-

      - name: Cache PLT
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: plt-${{ hashFiles('**/.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ hashFiles('**/.tool-versions') }}-
            plt-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors --all-warnings

      # Code formatting
      - name: Check formatting
        run: mix format --dry-run --check-formatted

      # Unused dependencies
      - name: Check unused deps
        run: mix deps.unlock --check-unused

      # Security audits
      - name: Hex audit
        run: mix hex.audit
      - name: Deps audit
        run: mix deps.audit

      # Static analysis - strict mode with all priority levels
      - name: Credo (strict + all)
        run: mix credo --strict --all

      # Security scanner - exit on any issue
      - name: Sobelow (strict)
        run: mix sobelow --config --exit low

      # Translations up to date
      - name: Gettext (check translations)
        run: mix gettext.extract --check-up-to-date

      # Type checking
      - name: Create PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Dialyzer
        run: mix dialyzer --format github

      # Documentation coverage (optional - warn only)
      - name: Doctor (documentation coverage)
        run: mix doctor --summary || true

      # Filesystem vulnerability scan
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          scanners: "vuln,misconfig,license"
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: _build,deps
          severity: "CRITICAL,HIGH"

  test:
    name: TEST
    needs: [tools]
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-
            ${{ env.MIX_ENV }}-mise-

      - run: mix deps.get
      - run: mix ecto.create
      - run: mix ecto.migrate

      # Run tests with coverage (minimum_coverage in coveralls.json enforces threshold)
      - name: Run tests with coverage
        run: mix coveralls.json

      # Upload coverage to Codecov (optional but recommended)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cover/excoveralls.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: BUILD
    needs: [quality, test]
    runs-on: ubuntu-24.04
    # Publication de l'image sur ghcr.io lors d'un tag. Les permissions du
    # workflow sont en lecture seule : ce job est le seul a avoir besoin
    # d'ecrire, il les eleve donc pour lui seul.
    permissions:
      contents: read
      packages: write
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.MIX_ENV }}-mise-${{ hashFiles('**/.tool-versions') }}-mix-
            ${{ env.MIX_ENV }}-mise-

      - run: mix deps.get --only prod
      - run: mix do assets.setup + compile --warnings-as-errors + assets.deploy + release --overwrite

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t image:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "image:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Docker meta
        if: ${{ contains(github.ref, 'refs/tags/') }}
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # `GITHUB_TOKEN` suffit pour ghcr.io avec la permission `packages: write`
      # declaree sur ce job : aucun secret a provisionner ni a faire tourner,
      # contrairement au couple DOCKER_USER / DOCKER_TOKEN qu'il remplace.
      - name: Login to GitHub Container Registry
        if: ${{ contains(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: ${{ contains(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
