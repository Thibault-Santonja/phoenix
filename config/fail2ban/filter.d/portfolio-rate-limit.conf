# Fail2Ban filter for Portfolio rate limiting
#
# This filter matches rate limit exceeded log entries from the Portfolio Phoenix application.
# The application logs rate limit violations with the client IP address.
#
# Author: Portfolio Security Team
# Date: 2025-11-13

[Definition]

# Match rate limit exceeded logs with IP addresses
# Example log format:
# [warning] Rate limit exceeded for login_request identifier: 192.168.1.100 retry_after_seconds: 300
failregex = ^.*Rate limit exceeded.*identifier:\s*<HOST>.*$

# Ignore internal monitoring or health check IPs if needed
ignoreregex =

# Date pattern for Phoenix logs (ISO8601 format)
datepattern = ^%%Y-%%m-%%d[T ]%%H:%%M:%%S
