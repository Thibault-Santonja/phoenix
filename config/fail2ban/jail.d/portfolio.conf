# Fail2Ban jail configuration for Portfolio application
#
# This jail protects the Portfolio Phoenix application from brute force attacks
# by banning IPs that exceed rate limits.
#
# Installation:
#   sudo cp config/fail2ban/filter.d/portfolio-rate-limit.conf /etc/fail2ban/filter.d/
#   sudo cp config/fail2ban/jail.d/portfolio.conf /etc/fail2ban/jail.d/
#   sudo systemctl restart fail2ban
#
# Author: Portfolio Security Team
# Date: 2025-11-13

[portfolio-rate-limit]
enabled = true
port = http,https
filter = portfolio-rate-limit
logpath = /var/log/portfolio/*.log
          /var/log/portfolio/production.log
          /var/log/syslog
maxretry = 20
findtime = 600
bantime = 3600
action = iptables-multiport[name=portfolio, port="http,https", protocol=tcp]

# Configuration explanation:
# - enabled: Activate this jail
# - port: Protect both HTTP (80) and HTTPS (443)
# - filter: Use the portfolio-rate-limit filter
# - logpath: Monitor Phoenix production logs (adjust path based on deployment)
# - maxretry: Ban after 20 rate limit violations
# - findtime: Within 600 seconds (10 minutes)
# - bantime: Ban for 3600 seconds (1 hour)
# - action: Block using iptables on HTTP/HTTPS ports

# Deployment notes:
# 1. Adjust logpath to match your actual log location:
#    - Docker/Kamal: /var/log/portfolio/production.log
#    - Systemd: Check journalctl output location
#    - Custom: Update based on deployment setup
#
# 2. Verify Phoenix logger configuration outputs to file:
#    config :logger, :console,
#      format: "$time $metadata[$level] $message\n",
#      metadata: [:request_id]
#
# 3. Test filter with:
#    fail2ban-regex /path/to/log /etc/fail2ban/filter.d/portfolio-rate-limit.conf
#
# 4. Monitor with:
#    sudo fail2ban-client status portfolio-rate-limit
