# Name of your application. Used to uniquely configure containers.
service: portfolio

# Name of the container image.
image: thibaultsan/portfolio

# Deploy to these servers.
servers:
  web:
    - 157.180.70.8

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  hosts:
    - thibaultsan.com
    - amvcc.thibaultsan.com
    - photo.thibaultsan.com
    - tech.thibaultsan.com
  # Proxy connects to your container on port 80 by default.
  app_port: 4000
  healthcheck:
    interval: 30
    path: /health
    timeout: 3

# Credentials for your image host.
registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
#
# Le build se fait sur le serveur, nativement en amd64. L'émulation amd64 sur
# un Mac Apple Silicon corrompt la mémoire du BEAM pendant "mix deps.compile"
# (erreurs "no next heap size found" puis abort), y compris avec Rosetta.
builder:
  context: .
  arch: amd64
  remote: ssh://amvcc@157.180.70.8
  # Pass in additional build args needed for your Dockerfile.
  # args:
  #   RUBY_VERSION: <%= ENV["RBENV_VERSION"] || ENV["rvm_ruby_string"] || "#{RUBY_ENGINE}-#{RUBY_ENGINE_VERSION}" %>

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    PHX_SERVER: true
    POOL_SIZE: "10"
    PHX_HOST: "thibaultsan.com"
    # SMTP relay for the magic links. Without it the app refuses to boot rather
    # than silently falling back to the local adapter, which sends nothing.
    SMTP_RELAY: "smtp.protonmail.ch"
    SMTP_PORT: "587"
    # Address of the photography platform on the host's internal network. The
    # app refuses to boot without it rather than falling back to
    # http://localhost:4000, which is the portfolio itself.
    CATALOG_BASE_URL: "http://photography:4000"
    # Persistent volume for the catalog snapshots: it is what lets the
    # portfolio still show albums when both apps restart together.
    CATALOG_SNAPSHOT_DIR: "/app/catalog"
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    # Required by config/runtime.exs: the app refuses to boot without it.
    - LIVE_VIEW_SIGNING_SALT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    # Read by Portfolio.Bootstrap to create the administrator account.
    - ADMIN_EMAIL

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal app logs -r job" will tail logs from the first server in the job section.
aliases:
  iex: app exec --interactive --reuse "./bin/portfolio remote"
  ssh: app exec --interactive --reuse "bash"
  logs: app logs -f

# Use a different ssh user than root
ssh:
  user: amvcc
# Use a persistent storage volume.
volumes:
  - "/var/portfolio/uploads:/app/priv/static/uploads"
  - "/var/portfolio/backups:/app/backups"
  - "/var/portfolio/catalog:/app/catalog"
# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:16-alpine
    host: 157.180.70.8
    port: 5432
    env:
      clear:
        POSTGRES_DB: portfolio_prod
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /var/portfolio/db:/var/lib/postgresql/data
    cmd: postgres -c shared_preload_libraries='pg_stat_statements' -c pg_stat_statements.track=all
